name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linguastack
          POSTGRES_PASSWORD: linguastack
          POSTGRES_DB: linguastack
        ports:
          - 5434:5432
        options: >-
          --health-cmd "psql -U linguastack -d linguastack -c 'select 1'"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # Тестовые базы (linguastack_test и linguastack_test_<пакет>)
      # тесты создают сами.
      LINGUASTACK_TEST_DATABASE_URL: postgres://linguastack:linguastack@localhost:5434/linguastack_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Версия тулчейна — из toolchain в go.mod.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Линтер
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # Собрать тем же тулчейном, что и проект: готовый бинарник может
          # быть собран более старым Go и не понять go.mod.
          install-mode: goinstall
          working-directory: backend
      - name: Тесты
        # Без живых моделей: тесты с Ollama и Anthropic включаются
        # переменными LINGUASTACK_LIVE_* и здесь пропускаются.
        run: go test -race -count=1 ./...
      - name: Сборка
        run: go build ./cmd/...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Сборка образа
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: linguastack:ci
