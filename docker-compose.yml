services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: linguastack
      POSTGRES_PASSWORD: linguastack
      POSTGRES_DB: linguastack
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguastack"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
