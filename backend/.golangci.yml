version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec      # ТЗ §13: безопасность загрузок, путей, секретов
    - bodyclose  # незакрытые тела ответов провайдеров текут соединениями
    - errorlint  # errors.Is/As вместо сравнения ошибок через ==
    - noctx      # HTTP-запросы к провайдерам обязаны нести контекст (таймауты, отмена)
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
